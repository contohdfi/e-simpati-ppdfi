<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>e-SIMPATI PP DFI - Pondok Pesantren Darul Fawaid Ilmiyah</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- SweetAlert2 & Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <nav id="sidebar">
      <div class="sidebar-header text-center py-4">
        <div class="mb-2">
          <span class="material-icons p-2 rounded-circle bg-white text-success shadow-sm" style="font-size: 32px;">verified_user</span>
        </div>
        <h5 class="fw-bold mb-0 text-white" style="letter-spacing: 1px;">e-SIMPATI</h5>
        <p class="text-white-50 mb-1" style="font-size: 0.7rem; line-height: 1.2;">Sistem Monitoring Pengajar Terintegrasi</p>
        <div style="font-size: 0.75rem; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 5px; margin-top: 5px;" class="text-white">
          Pondok Pesantren<br><strong>Darul Fawaid Ilmiyah</strong>
        </div>
      </div>
      <div class="sidebar-menu mt-3">
        <a href="#" class="active" onclick="navigate('dashboard')"><span class="material-icons">dashboard</span> Dashboard</a>
        <a href="#" onclick="navigate('attendance')"><span class="material-icons">edit_note</span> Daftar Hadir</a>
        <a href="#" onclick="navigate('rekap')"><span class="material-icons">bar_chart</span> Rekap</a>
        <a href="#" onclick="navigate('settings')"><span class="material-icons">settings</span> Pengaturan</a>
      </div>
    </nav>

    <!-- Page Content -->
    <div class="content-wrapper">
      <!-- Header Fleksibel (Desktop & Mobile) -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-2 gap-md-0">
        <div class="d-flex align-items-center">
          <button class="btn btn-white d-md-none me-3 shadow-sm border bg-white" onclick="toggleSidebar()">
            <span class="material-icons align-middle">menu</span>
          </button>
          <h4 class="mb-0" style="font-size: 1.25rem; color: #2c3e50; line-height: 1.4;">Assalamu'alaikum, Admin</h4>
        </div>
        
        <div class="text-end align-self-end align-self-md-auto mt-2 mt-md-0">
          <div id="currentDate" class="text-muted" style="font-size: 0.85rem;"></div>
          <div id="liveClock" class="clock-display text-success" style="font-size: 1.15rem; font-weight: 700; letter-spacing: 0.5px;"></div>
        </div>
      </div>

      <!-- Container Dinamis SPA -->
      <div id="appContainer">
        <!-- Konten akan di-inject via JS -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
